# TS checks (ws 0.7.1) — biome + tsc + vitest. Runs CONCURRENTLY with ci-python
# (neither waits on the other). Red blocks merge (branch protection).
name: ci-ts
on:
  pull_request:
  push:
    branches: [main]

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm turbo typecheck
      - run: pnpm turbo test --filter='!@ci/ai'
