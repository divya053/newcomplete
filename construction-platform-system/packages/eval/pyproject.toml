[project]
name = "ci-eval"
version = "0.0.0"
description = "The eval harness — the measurement instrument that gates AI-touching changes (ws 0.8)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eval"]
