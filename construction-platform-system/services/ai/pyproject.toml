[project]
name = "ci-ai"
version = "0.0.0"
description = "Construction Intelligence — stateless AI tier (arq consumers). AI proposes; the domain disposes."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "arq>=0.26",
  "redis>=5.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "anthropic>=0.42",
  "voyageai>=0.3",
  "structlog>=24.4",
  "langfuse>=2.57",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.14", "pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
